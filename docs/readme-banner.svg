  <g fill="#d3e3dc"><circle cx="1061" cy="86" r="2"/><circle cx="905" cy="74" r="1.5"/><circle cx="1089" cy="218" r="1.5"/><path d="m1042 160 2.5 7.5 7.5 2.5-7.5 2.5-2.5 7.5-2.5-7.5-7.5-2.5 7.5-2.5z"/></g>
